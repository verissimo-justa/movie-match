<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cam match</title>
    
    <!-- FUENTES CORREGIDAS (Fraunces en lugar de Alfa Slab One) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Inter:wght@400;500;700&family=Oswald:wght@600&display=swap" rel="stylesheet">

    <!-- LIBRERÍAS -->
    <script src="https://unpkg.com/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f7f2d4; 
            color: #333333;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            font-family: 'Fraunces', serif !important;
            font-weight: 400 !important;
            font-size: 2.5rem;
            margin-bottom: 0px;
            color: #6488b4; 
            letter-spacing: -1px;
            text-align: center;
        }
        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: #222222;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f7f2d4;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-screen input {
            padding: 12px 20px;
            font-size: 1.1rem;
            border: 2px solid #6488b4;
            border-radius: 8px;
            margin-bottom: 15px;
            width: 260px;
            outline: none;
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #333333;
            text-align: center;
        }
        .login-screen button {
            padding: 12px 30px;
            font-size: 1.1rem;
            background-color: #6488b4;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: bold;
        }
        .tinder-container {
            position: relative;
            /* Ancho fijo en móvil de 260px */
            width: 240px; 
            /* Quitamos la altura fija de 440px. Al dejar que el contenido defina la altura, 
               el contenedor no dejará espacios vacíos raros abajo. */
            min-height: 400px; /* Un mínimo para que no colapse si tarda en cargar */
            perspective: 1000px;
            /* Lo centramos por si acaso */
            margin: 0 auto; 
        }
        .movie-card {
            position: absolute;
            /* En lugar de un ancho fijo, usamos 100% del contenedor padre que ahora achicaremos */
            width: 100%; 
            /* Quitamos el height: 100% para que la tarjeta crezca según la imagen */
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            /* ELIMINADO: box-shadow (el sombreado azulado) */
            display: flex;
            flex-direction: column;
            cursor: grab;
            transform-origin: 50% 100%;
            transition: transform 0.2s ease, opacity 0.2s ease;
            border: 1px solid rgba(100, 136, 180, 0.1); /* Este bordecito sutil lo dejamos */
        }

        .movie-card img { 
            width: 100%; 
            /* CAMBIO CLAVE: height auto para que respete la proporción original */
            height: auto; 
            /* CAMBIO CLAVE: object-fit contain para que no se recorte nada */
            object-fit: contain; 
            pointer-events: none; 
            display: block; /* Evita un pequeño espacio en blanco debajo de la imagen */
        }

        .movie-info { 
            padding: 15px; 
            /* Ya no necesita flex-grow porque la tarjeta se adapta al contenido */
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start; 
            background: #ffffff; 
        }
        .movie-title-row { display: flex; align-items: baseline; justify-content: flex-start; gap: 8px; width: 100%; margin-bottom: 2px; }
        .movie-title { font-family: 'Oswald', sans-serif; font-size: 1.4rem; font-weight: 600; color: #000000; text-transform: uppercase; letter-spacing: -0.3px; line-height: 1.1; }
        .movie-year { font-family: 'Oswald', sans-serif; font-size: 1.2rem; font-weight: 600; color: #8c8c8c; }
        .movie-original-title { font-family: 'Oswald', sans-serif; font-size: 1.1rem; font-weight: 600; color: #8c8c8c; text-transform: uppercase; letter-spacing: -0.3px; }
        
        .status-message { text-align: center; padding: 10px; color: #6488b4; font-weight: 700; font-size: 1.3rem; font-family: 'Inter', sans-serif; width: 100%; max-height: 100%; overflow-y: auto; }
        .likes-list { text-align: left; background: white; padding: 15px; border-radius: 12px; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 1.1rem; color: #333; max-height: 220px; overflow-y: auto; }
        .likes-item { padding: 6px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .likes-item span { color: #8c8c8c; }
        
        .buttons { 
            margin-top: 25px; 
            display: flex; 
            gap: 25px; 
        }
        
        .btn { 
            border: none; 
            width: 65px; /* Un poco más grandes para que respiren los SVG */
            height: 65px; 
            border-radius: 50%; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            /* Quitamos el sombreado para que queden planos como los SVG */
            box-shadow: none; 
            background-color: transparent; /* Fondo transparente */
            border: 2px solid rgba(100, 136, 180, 0.6); /* Borde con el color de la marca */
            opacity: 0.6; /* Opacidad base del 60% */
            transition: transform 0.2s ease, opacity 0.2s ease, background-color 0.2s ease; 
        }
        
        /* La animación al tocar (o mantener el mouse encima en compu) */
        .btn:hover, .btn:active { 
            transform: scale(1.2); /* Crece un 20% */
            opacity: 1; /* Opacidad al 100% */
            background-color: rgba(100, 136, 180, 0.1); /* Un fondito sutil para dar feedback */
        }
        
        /* Ya no necesitamos los colores rojo y verde, pero dejamos las clases por si las usas */
        .btn-no, .btn-yes { 
            background-color: transparent; 
        }
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreen">
        <h1>cam match</h1>
        <div class="subtitle">pensamos el cine</div>
        <input type="text" id="usernameInput" placeholder="Tu nombre o alias" maxlength="15">
        <button id="loginBtn">Ingresar</button>
    </div>

    <h1>cam match</h1>
    <div class="subtitle">pensamos el cine</div>

    <div class="tinder-container" id="cardContainer"></div>

    <div class="buttons">
        <button class="btn btn-no" id="rejectBtn">
            <svg viewBox="0 0 24 24" width="30" height="30" stroke="#6488b4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <button class="btn btn-yes" id="acceptBtn">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="#6488b4" stroke="none">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
        </button>
    </div>
    
    <script>
        // CONEXIÓN A SUPABASE
        const SUPABASE_URL = 'https://sngdbenngxnbxhapkqkc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuZ2RiZW5uZ3huYnhoYXBrcWtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTA3MTYsImV4cCI6MjEwODI4NjcxNn0.2ypfGrSiDPeXoctRU5VCBGsZn3o6J62wwQ3ftMbUZ6w';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const container = document.getElementById('cardContainer');
        let usuarioActual = "";
        let peliculasElegidas = [];

        document.getElementById('loginBtn').addEventListener('click', () => {
            const nombre = document.getElementById('usernameInput').value.trim();
            if (nombre) {
                usuarioActual = nombre;
                document.getElementById('loginScreen').style.display = 'none';
                inicializarApp();
            }
        });

        async function inicializarApp() {
            try {
                const respuesta = await fetch('./peliculas.json');
                if (!respuesta.ok) throw new Error("No se encontró el archivo JSON");
                
                const peliculasReales = await respuesta.json();
                
                // Filtramos solo las activas
                const peliculasActivas = peliculasReales.filter(pelicula => pelicula.activa === true);
                
                // Mezclamos
                peliculasActivas.sort(() => Math.random() - 0.5);
                
                // Cargamos
                cargarTarjetas(peliculasActivas);
            } catch (error) {
                console.error("Error al cargar:", error);
                container.innerHTML = "<div class='status-message'>Error al cargar las películas.</div>";
            }
        }

        function cargarTarjetas(listaPeliculas) {
            container.innerHTML = ""; 
            listaPeliculas.forEach((movie, index) => {
                const card = document.createElement('div');
                card.classList.add('movie-card');
                card.setAttribute('data-id', movie.id);
                card.setAttribute('data-titulo', movie.titulo);
                card.setAttribute('data-anio', movie.anio);
                card.style.zIndex = listaPeliculas.length - index; 
                
                const tituloOriginal = movie.titulo_original || movie.titulo;
                const urlPoster = movie.poster ? movie.poster : 'https://via.placeholder.com/600x900/cccccc/ffffff?text=Sin+Imagen';
                
                card.innerHTML = `
                    <img src="${urlPoster}" alt="${movie.titulo}">
                    <div class="movie-info">
                        <div class="movie-title-row">
                            <span class="movie-title">${movie.titulo}</span>
                            <span class="movie-year">${movie.anio}</span>
                        </div>
                        <div class="movie-original-title">${tituloOriginal}</div>
                    </div>
                `;
                container.appendChild(card);
                configurarGesto(card);
            });
        }

        function configurarGesto(card) {
            const hamertime = new Hammer(card);
            hamertime.on('pan', (event) => {
                card.style.transition = 'none';
                let rotation = event.deltaX / 10;
                card.style.transform = `translate(${event.deltaX}px, ${event.deltaY}px) rotate(${rotation}deg)`;
            });

            hamertime.on('panend', (event) => {
                card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                if (event.deltaX > 120) {
                    animarSalida(card, 1000, event.deltaY, true);
                } else if (event.deltaX < -120) {
                    animarSalida(card, -1000, event.deltaY, false);
                } else {
                    card.style.transform = 'translate(0px, 0px) rotate(0deg)';
                }
            });
        }

        function animarSalida(card, x, y, esLike) {
            card.style.transform = `translate(${x}px, ${y}px) rotate(${x/10}deg)`;
            card.style.opacity = '0';
            
            if (esLike) {
                peliculasElegidas.push({
                    id: card.getAttribute('data-id'),
                    titulo: card.getAttribute('data-titulo'),
                    anio: card.getAttribute('data-anio')
                });
            }
            
            setTimeout(() => {
                card.remove();
                if (container.children.length === 0) {
                    finalizarVotacion();
                }
            }, 300);
        }

        async function finalizarVotacion() {
            document.querySelector('.buttons').style.display = 'none';
            
            if (peliculasElegidas.length > 0) {
                try {
                    const votosAEnviar = peliculasElegidas.map(p => ({
                        participante: usuarioActual,
                        pelicula_id: p.id,
                        pelicula_titulo: p.titulo
                    }));
        
                    const { error } = await _supabase
                        .from('votos_taller')
                        .insert(votosAEnviar);
        
                    if (error) console.error("Error al guardar votos:", error);
                    else console.log("Votos guardados exitosamente");
                    
                } catch (err) {
                    console.error("Error de conexión:", err);
                }
            }
        
            let HTMLResultados = `
                <div class='status-message'>
                    🍿 ¡Elegiste ${peliculasElegidas.length} películas!<br>
                    <div class='likes-list'>
            `;
            
            if(peliculasElegidas.length === 0) {
                HTMLResultados += "<div style='text-align:center;color:#8c8c8c;padding:20px;'>No seleccionaste ninguna película.</div>";
            } else {
                peliculasElegidas.forEach(p => {
                    HTMLResultados += `<div class='likes-item'>${p.titulo} <span>${p.anio}</span></div>`;
                });
            }
            
            HTMLResultados += `</div></div>`;
            container.innerHTML = HTMLResultados;
        }

        document.getElementById('rejectBtn').addEventListener('click', () => {
            const tarjetaActual = container.querySelector('.movie-card');
            if (tarjetaActual) animarSalida(tarjetaActual, -1000, 0, false);
        });

        document.getElementById('acceptBtn').addEventListener('click', () => {
            const tarjetaActual = container.querySelector('.movie-card');
            if (tarjetaActual) animarSalida(tarjetaActual, 1000, 0, true);
        });
    </script>
</body>
</html>
