<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cam match</title>
    
    <!-- FUENTES: Importación correcta desde Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500;700&family=Oswald:wght@600&display=swap" rel="stylesheet">

    <!-- LIBRERÍA: Hammer.js para reconocer los gestos de deslizamiento -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f7f2d4; 
            color: #333333;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            font-family: 'Alfa Slab One', serif !important;
            font-weight: 400 !important;
            font-size: 2.5rem;
            margin-bottom: 3px;
            color: #6488b4; 
            letter-spacing: -0.5px;
            text-align: center;
        }
        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: #222222;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f7f2d4;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-screen input {
            padding: 12px 20px;
            font-size: 1.1rem;
            border: 2px solid #6488b4;
            border-radius: 8px;
            margin-bottom: 15px;
            width: 260px;
            outline: none;
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #333333;
            text-align: center;
        }
        .login-screen button {
            padding: 12px 30px;
            font-size: 1.1rem;
            background-color: #6488b4;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: bold;
        }
        .tinder-container {
            position: relative;
            width: 320px;
            height: 440px;
            perspective: 1000px;
        }
        .movie-card {
            position: absolute;
            width: 100%; height: 100%;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(100, 136, 180, 0.15); 
            display: flex;
            flex-direction: column;
            cursor: grab;
            transform-origin: 50% 100%;
            transition: transform 0.2s ease, opacity 0.2s ease;
            border: 1px solid rgba(100, 136, 180, 0.1);
        }
        .movie-card img { width: 100%; height: 75%; object-fit: cover; pointer-events: none; }
        .movie-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-start; background: #ffffff; }
        .movie-title-row { display: flex; align-items: baseline; justify-content: flex-start; gap: 8px; width: 100%; margin-bottom: 2px; }
        .movie-title { font-family: 'Oswald', sans-serif; font-size: 1.4rem; font-weight: 600; color: #000000; text-transform: uppercase; letter-spacing: -0.3px; line-height: 1.1; }
        .movie-year { font-family: 'Oswald', sans-serif; font-size: 1.2rem; font-weight: 600; color: #8c8c8c; }
        .movie-original-title { font-family: 'Oswald', sans-serif; font-size: 1.1rem; font-weight: 600; color: #8c8c8c; text-transform: uppercase; letter-spacing: -0.3px; }
        .status-message { text-align: center; padding: 35% 10px 0 10px; color: #6488b4; font-weight: 700; font-size: 1.5rem; font-family: 'Oswald', sans-serif; text-transform: uppercase; line-height: 1.3; }
        .buttons { margin-top: 25px; display: flex; gap: 25px; }
        .btn { border: none; width: 55px; height: 55px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: transform 0.1s ease; }
        .btn:active { transform: scale(0.9); }
        .btn-no { background-color: #ffecef; color: #ff4757; border: 1px solid #ffccd2; }
        .btn-yes { background-color: #e6f9ed; color: #2ed573; border: 1px solid #c2f0d5; }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div class="login-screen" id="loginScreen">
        <h1>cam match</h1>
        <div class="subtitle">pensamos el cine</div>
        <!-- Vinculamos la sala a un código único simple -->
        <input type="text" id="roomInput" placeholder="Código de la sala (Ej: cine123)" maxlength="10">
        <input type="text" id="usernameInput" placeholder="Tu nombre o alias" maxlength="15">
        <button id="loginBtn">Ingresar</button>
    </div>

    <h1>cam match</h1>
    <div class="subtitle">pensamos el cine</div>

    <div class="tinder-container" id="cardContainer"></div>

    <div class="buttons">
        <button class="btn btn-no" id="rejectBtn">❌</button>
        <button class="btn btn-yes" id="acceptBtn">💚</button>
    </div>

    <script>
        const container = document.getElementById('cardContainer');
        let usuarioActual = "";
        let salaId = "";
        let likesUsuario = [];
        let juegoTerminado = false;
        
        // Usamos una URL de almacenamiento global compartida basada en el PIN de la sala
        let apiStorageUrl = "https://psty.io";

        document.getElementById('loginBtn').addEventListener('click', () => {
            const sala = document.getElementById('roomInput').value.trim().toLowerCase();
            const nombre = document.getElementById('usernameInput').value.trim().toLowerCase();
            
            if (sala && nombre) {
                salaId = sala;
                usuarioActual = nombre;
                document.getElementById('loginScreen').style.display = 'none';
                inicializarApp();
            }
        });

        async function inicializarApp() {
            try {
                const respuesta = await fetch('peliculas.json');
                const peliculasReales = await respuesta.json();
                
                // Mantenemos el mismo orden aleatorio para todo el grupo basándonos en el ID de película
                peliculasReales.sort((a, b) => a.id - b.id);
                cargarTarjetas(peliculasReales);

                // Empezamos a monitorizar en segundo plano si alguien del grupo ya hizo MATCH
                setInterval(comprobarMatchesEnLaNube, 5000);
            } catch (error) {
                container.innerHTML = "<div class='status-message'>Error al cargar las películas.</div>";
            }
        }

        function cargarTarjetas(listaPeliculas) {
            container.innerHTML = ""; 
            listaPeliculas.forEach((movie, index) => {
                const card = document.createElement('div');
                card.classList.add('movie-card');
                card.setAttribute('data-id', movie.id);
                card.setAttribute('data-titulo', movie.titulo);
                card.style.zIndex = listaPeliculas.length - index; 
                
                const tituloOriginal = movie.titulo_original || movie.titulo;
                
                card.innerHTML = `
                    <img src="${movie.poster}" alt="${movie.titulo}">
                    <div class="movie-info">
                        <div class="movie-title-row">
                            <span class="movie-title">${movie.titulo}</span>
                            <span class="movie-year">${movie.anio}</span>
                        </div>
                        <div class="movie-original-title">${tituloOriginal}</div>
                    </div>
                `;
                container.appendChild(card);
                configurarGesto(card);
            });
        }

        function configurarGesto(card) {
            const hamertime = new Hammer(card);
            hamertime.on('pan', (event) => {
                if (juegoTerminado) return;
                card.style.transition = 'none';
                let rotation = event.deltaX / 10;
                card.style.transform = `translate(${event.deltaX}px, ${event.deltaY}px) rotate(${rotation}deg)`;
            });

            hamertime.on('panend', (event) => {
                if (juegoTerminado) return;
                card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                if (event.deltaX > 120) {
                    animarSalida(card, 1000, event.deltaY, true);
                } else if (event.deltaX < -120) {
                    animarSalida(card, -1000, event.deltaY, false);
                } else {
                    card.style.transform = 'translate(0px, 0px) rotate(0deg)';
                }
            });
        }

        function animarSalida(card, x, y, esLike) {
            card.style.transform = `translate(${x}px, ${y}px) rotate(${x/10}deg)`;
            card.style.opacity = '0';
            
            const movieId = card.getAttribute('data-id');
            const movieTitulo = card.getAttribute('data-titulo');
            
            if (esLike) {
                enviarVotoALaNube(movieId, movieTitulo);
            }
            
            setTimeout(() => {
                card.remove();
                if (container.children.length === 0 && !juegoTerminado) {
                    container.innerHTML = "<div class='status-message'>¡Terminaste la lista!<br><br><span style='font-size:1.1rem; font-weight:400; color:#333;'>Esperando que los demás terminen de votar...</span></div>";
                    document.querySelector('.buttons').style.display = 'none';
                }
            }, 300);
        }

        // Envía el voto de forma transparente a internet
        async function enviarVotoALaNube(movieId, titulo) {
            const urlGrupo = apiStorageUrl + salaId + "_" + movieId;
            try {
                let actualesRef = await fetch(urlGrupo);
                let datos = { titulo: titulo, usuarios: [] };
                
                if (actualesRef.ok) {
                    datos = await actualesRef.json();
                }
                
                if (!datos.usuarios.includes(usuarioActual)) {
                    datos.usuarios.push(usuarioActual);
                    
                    await fetch(urlGrupo, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(datos)
                    });
                }
            } catch (e) { console.error("Error de sincronización", e); }
        }

        // Revisa automáticamente si hay coincidencia de las 8 personas
        async function comprobarMatchesEnLaNube() {
            if (juegoTerminado) return;
            
            try {
                const respuesta = await fetch('peliculas.json');
                const peliculas = await respuesta.json();

                for (let movie of peliculas) {
                    let res = await fetch(apiStorageUrl + salaId + "_" + movie.id);
                    if (res.ok) {
                        let datosPeli = await res.json();
                        // Si alcanzó las 8 personas del grupo
                        if (datosPeli.usuarios && datosPeli.usuarios.length >= 8) {
                            juegoTerminado = true;
                            
                            container.innerHTML = `
                                <div class='status-message' style='color: #2ed573; padding-top: 25%;'>
                                    🎉 ¡TENEMOS MATCH!<br><br>
                                    <span style='color:#000; font-size:2rem; line-height:1.2; display:block; font-family:Oswald;'>${datosPeli.titulo}</span><br>
                                    Coincidencia total de las 8 personas
                                </div>`;
                            document.querySelector('.buttons').style.display = 'none';
                            break;
                        }
                    }
                }
            } catch (e) { }
        }

        document.getElementById('rejectBtn').addEventListener('click', () => {
            const tarjetaActual = container.querySelector('.movie-card');
            if (tarjetaActual) animarSalida(tarjetaActual, -1000, 0, false);
        });

        document.getElementById('acceptBtn').addEventListener('click', () => {
            const tarjetaActual = container.querySelector('.movie-card');
            if (tarjetaActual) animarSalida(tarjetaActual, 1000, 0, true);
        });
    </script>
</body>
</html>
