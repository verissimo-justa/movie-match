<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cam match</title>

    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Inter:wght@400;500;700&family=Oswald:wght@600&display=swap" rel="stylesheet">

    <!-- LIBRERÍAS -->
    <script src="https://unpkg.com/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f7f2d4;
            color: #333333;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            touch-action: pan-y;
        }

        h1, .login-title {
            font-family: 'Fraunces', serif !important;
            font-weight: 900 !important;
            font-size: 2.2rem;
            margin-top: 0px;
            margin-bottom: 0px;
            color: #6488b4;
            letter-spacing: -1px;
            text-align: center;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            color: #222222;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f7f2d4;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-screen input {
            padding: 12px 20px;
            font-size: 1.1rem;
            border: 2px solid #6488b4;
            border-radius: 8px;
            margin-bottom: 15px;
            width: 260px;
            outline: none;
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #333333;
            text-align: center;
        }

        .login-screen button {
            padding: 12px 30px;
            font-size: 1.1rem;
            background-color: #6488b4;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: bold;
        }

        /* --- CARRUSEL WRAPPER Y FLECHAS --- */
        .carrusel-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px; /* Reducido un poco para compensar el ancho de la tarjeta */
            width: 100%;
            max-width: 420px;
        }

        .flecha-lateral {
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: none;
            border: none;
        }

        .flecha-lateral:active {
            opacity: 1;
            transform: scale(1.2);
        }

        /* --- TARJETA +10% --- */
        .tinder-container {
            position: relative;
            width: 242px; 
            height: 418px; 
            overflow: hidden;
            border-radius: 18px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            background: transparent;
        }

        .movie-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(100, 136, 180, 0.15);
            /* El padding es de 10px en los tres lados que pediste. 
               Abajo no tiene padding porque el texto necesita su propio espacio */
            padding: 10px 10px 0px 10px; 
            transition: left 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
        }

        .movie-card img {
            width: 100%;
            /* EL TRUCO: Le decimos que use el alto que necesite, 
               pero como máximo 270px para no empujar los textos fuera de la tarjeta */
            height: auto;
            max-height: 270px; 
            /* object-fit: contain asegura que la foto se vea entera sin recortes */
            object-fit: contain; 
            background-color: #ffffff;
            pointer-events: none;
            display: block;
            /* Le damos el redondeo a la foto para que no choque con el borde de la tarjeta */
            border-radius: 14px; 
        }

        .movie-info {
            /* Ajustamos el padding para que los textos no estén pegados a los bordes del póster */
            padding: 10px 5px 10px 5px; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            background: transparent;
            flex-grow: 1;
        }

        .movie-title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 6px;
            width: 100%;
            margin-bottom: 2px;
        }

        .movie-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: -0.3px;
            line-height: 1.1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .movie-year {
            font-family: 'Oswald', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            color: #8c8c8c;
        }

        .movie-original-title {
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: #8c8c8c;
            text-transform: uppercase;
            letter-spacing: -0.3px;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- BOTONES +10% --- */
        .buttons {
            margin-top: 15px;
            display: flex;
            gap: 25px;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .btn {
            border: none;
            width: 60px; /* 55 + 10% */
            height: 60px; /* 55 + 10% */
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            background-color: transparent;
            border: 2px solid rgba(100, 136, 180, 0.6);
            opacity: 0.6;
            transition: transform 0.2s ease, opacity 0.2s ease, background-color 0.2s ease;
        }

        .btn:hover, .btn:active {
            transform: scale(1.2);
            opacity: 1;
            background-color: rgba(100, 136, 180, 0.1);
        }

        /* --- RESULTADOS --- */
        .status-message { text-align: center; padding: 10px; color: #6488b4; font-weight: 700; font-size: 1.2rem; font-family: 'Inter', sans-serif; width: 100%; max-height: 100%; overflow-y: auto; }
        .likes-list { text-align: left; background: white; padding: 15px; border-radius: 12px; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 1rem; color: #333; max-height: 220px; overflow-y: auto; }
        .likes-item { padding: 6px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .likes-item span { color: #8c8c8c; }
        .likes-empty { text-align: center; color: #8c8c8c; padding: 20px; }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div class="login-screen" id="loginScreen">
        <div class="login-title">cam match</div>
        <div class="subtitle">pensamos el cine</div>
        <input type="text" id="usernameInput" placeholder="Tu nombre o alias" maxlength="15" aria-label="Tu nombre o alias" autocomplete="off">
        <button id="loginBtn">Ingresar</button>
    </div>

    <!-- Título y subtítulo -->
    <h1>cam match</h1>
    <div class="subtitle">pensamos el cine</div>

    <!-- Contenedor con las flechas laterales -->
    <div class="carrusel-wrapper">
        <button type="button" class="flecha-lateral" id="flechaIzq" aria-label="Película anterior">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="#6488b4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>

        <div class="tinder-container" id="cardContainer"></div>

        <button type="button" class="flecha-lateral" id="flechaDer" aria-label="Película siguiente">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="#6488b4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </div>

    <!-- Botones OUT / IN -->
    <div class="buttons">
        <button type="button" class="btn btn-no" id="rejectBtn" aria-label="No me interesa">
            <svg viewBox="0 0 24 24" width="26" height="26" stroke="#6488b4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <button type="button" class="btn btn-yes" id="acceptBtn" aria-label="Me interesa">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="#6488b4" stroke="none" aria-hidden="true">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
        </button>
    </div>

    <script>
        const SUPABASE_URL = 'https://sngdbenngxnbxhapkqkc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuZ2RiZW5uZ3huYnhoYXBrcWtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTA3MTYsImV4cCI6MjEwODI4NjcxNn0.2ypfGrSiDPeXoctRU5VCBGsZn3o6J62wwQ3ftMbUZ6w';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const container = document.getElementById('cardContainer');
        const subtitulo = document.querySelector('body > .subtitle');
        const flechaIzq = document.getElementById('flechaIzq');
        const flechaDer = document.getElementById('flechaDer');

        let usuarioActual = "";
        let peliculasElegidas = [];
        let tarjetaActualIndex = 0;
        let procesando = false;
        window.listaPeliculas = [];

        function ingresar() {
            const nombre = document.getElementById('usernameInput').value.trim();
            if (!nombre) return;
            usuarioActual = nombre;
            document.getElementById('loginScreen').style.display = 'none';
            inicializarApp();
        }

        document.getElementById('loginBtn').addEventListener('click', ingresar);
        document.getElementById('usernameInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') ingresar();
        });

        async function inicializarApp() {
            try {
                const respuesta = await fetch('./peliculas.json');
                if (!respuesta.ok) throw new Error("No se encontró el archivo JSON");

                const peliculasReales = await respuesta.json();
                const peliculasActivas = peliculasReales.filter(p => p.activa === true);
                peliculasActivas.sort(() => Math.random() - 0.5);

                cargarTarjetas(peliculasActivas);
            } catch (error) {
                console.error("Error al cargar:", error);
                container.innerHTML = "<div class='status-message'>Error al cargar las películas.</div>";
            }
        }

        function crearTarjeta(movie) {
            const card = document.createElement('div');
            card.classList.add('movie-card');
            card.setAttribute('data-id', movie.id);

            const img = document.createElement('img');
            img.src = movie.poster ? movie.poster : 'https://via.placeholder.com/600x900/cccccc/ffffff?text=Sin+Imagen';
            img.alt = movie.titulo || '';

            const info = document.createElement('div');
            info.className = 'movie-info';

            const row = document.createElement('div');
            row.className = 'movie-title-row';

            const titulo = document.createElement('span');
            titulo.className = 'movie-title';
            titulo.textContent = movie.titulo;

            const anio = document.createElement('span');
            anio.className = 'movie-year';
            anio.textContent = movie.anio;

            row.appendChild(titulo);
            row.appendChild(anio);
            info.appendChild(row);

            if (movie.titulo_original && movie.titulo_original.trim() !== "") {
                const original = document.createElement('div');
                original.className = 'movie-original-title';
                original.textContent = movie.titulo_original;
                info.appendChild(original);
            }

            card.appendChild(img);
            card.appendChild(info);
            return card;
        }

        function cargarTarjetas(listaPeliculas) {
            container.innerHTML = "";
            window.listaPeliculas = listaPeliculas;
            tarjetaActualIndex = 0;

            if (listaPeliculas.length === 0) {
                finalizarVotacion();
                return;
            }

            listaPeliculas.forEach(movie => container.appendChild(crearTarjeta(movie)));

            actualizarCarrusel();
            configurarGestosCarrusel();
        }

        function actualizarCarrusel() {
            const total = window.listaPeliculas.length;
            if (total === 0) return;

            const offset = -(tarjetaActualIndex * 100);
            const tarjetas = container.querySelectorAll('.movie-card');

            tarjetas.forEach((card, index) => {
                card.style.left = `${(index * 100) + offset}%`;
            });

            if (subtitulo) {
                subtitulo.innerText = `Película ${tarjetaActualIndex + 1} de ${total}`;
                subtitulo.style.fontWeight = "bold";
                subtitulo.style.color = "rgba(120, 120, 120, 0.5)";
            }

            flechaIzq.style.opacity = "0.5";
            flechaDer.style.opacity = "0.5";
        }

        function irAnterior() {
            if (procesando) return;
            const total = window.listaPeliculas.length;
            if (total === 0) return;

            if (tarjetaActualIndex > 0) {
                tarjetaActualIndex--;
            } else {
                tarjetaActualIndex = total - 1;
            }
            actualizarCarrusel();
        }

        function irSiguiente() {
            if (procesando) return;
            const total = window.listaPeliculas.length;
            if (total === 0) return;

            if (tarjetaActualIndex < total - 1) {
                tarjetaActualIndex++;
            } else {
                tarjetaActualIndex = 0;
            }
            actualizarCarrusel();
        }

        function configurarGestosCarrusel() {
            const hamertime = new Hammer(container, { inputClass: Hammer.TouchMouseInput });
            hamertime.get('pan').set({ direction: Hammer.DIRECTION_HORIZONTAL });

            hamertime.on('pan', (event) => {
                if (procesando || window.listaPeliculas.length === 0) return;
                const offset = -(tarjetaActualIndex * 100) + (event.deltaX / 2.2);
                const tarjetas = container.querySelectorAll('.movie-card');
                tarjetas.forEach((card, index) => {
                    card.style.transition = 'none';
                    card.style.left = `${(index * 100) + offset}%`;
                });
            });

            hamertime.on('panend', (event) => {
                if (window.listaPeliculas.length === 0) return;
                const tarjetas = container.querySelectorAll('.movie-card');
                tarjetas.forEach(card => card.style.transition = '');

                const total = window.listaPeliculas.length;

                if (!procesando) {
                    if (event.deltaX > 40) {
                        if (tarjetaActualIndex > 0) {
                            tarjetaActualIndex--;
                        } else {
                            tarjetaActualIndex = total - 1;
                        }
                    } else if (event.deltaX < -40) {
                        if (tarjetaActualIndex < total - 1) {
                            tarjetaActualIndex++;
                        } else {
                            tarjetaActualIndex = 0;
                        }
                    }
                }
                actualizarCarrusel();
            });

            flechaIzq.onclick = irAnterior;
            flechaDer.onclick = irSiguiente;
        }

        async function guardarVoto(p) {
            try {
                await _supabase
                    .from('votos_taller')
                    .insert({
                        participante: usuarioActual,
                        pelicula_id: p.id,
                        pelicula_titulo: p.titulo
                    });
            } catch (err) {
                console.error("Error de conexión:", err);
            }
        }

        function decidirPelicula(esLike) {
            if (procesando || window.listaPeliculas.length === 0) return;
            procesando = true;

            const peliculaActual = window.listaPeliculas[tarjetaActualIndex];
            const tarjetas = container.querySelectorAll('.movie-card');
            const tarjetaDOM = tarjetas[tarjetaActualIndex];

            if (esLike) {
                const voto = { id: peliculaActual.id, titulo: peliculaActual.titulo, anio: peliculaActual.anio };
                peliculasElegidas.push(voto);
                guardarVoto(voto); 
                tarjetaDOM.style.transform = 'translateX(100%) rotate(15deg)';
            } else {
                tarjetaDOM.style.transform = 'translateX(-100%) rotate(-15deg)';
            }
            tarjetaDOM.style.opacity = '0';

            setTimeout(() => {
                tarjetaDOM.remove();
                window.listaPeliculas.splice(tarjetaActualIndex, 1);

                if (tarjetaActualIndex >= window.listaPeliculas.length && tarjetaActualIndex > 0) {
                    tarjetaActualIndex--;
                }

                if (window.listaPeliculas.length === 0) {
                    if (subtitulo) {
                        subtitulo.innerText = "pensamos el cine";
                        subtitulo.style.fontWeight = "400";
                        subtitulo.style.color = "#222222";
                    }
                    finalizarVotacion();
                } else {
                    const tarjetasRestantes = container.querySelectorAll('.movie-card');
                    tarjetasRestantes.forEach((card, idx) => {
                        card.style.left = `${idx * 100}%`;
                        card.style.transform = 'none';
                        card.style.opacity = '1';
                        card.style.transition = 'none';
                    });
                    setTimeout(() => {
                        tarjetasRestantes.forEach(card => card.style.transition = '');
                    }, 50);
                    
                    actualizarCarrusel();
                }
                procesando = false;
            }, 300);
        }

        function finalizarVotacion() {
            document.querySelector('.buttons').style.display = 'none';
            flechaIzq.style.display = 'none';
            flechaDer.style.display = 'none';

            container.innerHTML = "";
            
            const msg = document.createElement('div');
            msg.className = 'status-message';
            msg.appendChild(document.createTextNode(`🍿 ¡Elegiste ${peliculasElegidas.length} películas!`));
            msg.appendChild(document.createElement('br'));

            const lista = document.createElement('div');
            lista.className = 'likes-list';

            if (peliculasElegidas.length === 0) {
                const vacio = document.createElement('div');
                vacio.className = 'likes-empty';
                vacio.textContent = 'No seleccionaste ninguna película.';
                lista.appendChild(vacio);
            } else {
                peliculasElegidas.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'likes-item';
                    item.appendChild(document.createTextNode(p.titulo + ' '));
                    const anio = document.createElement('span');
                    anio.textContent = p.anio;
                    item.appendChild(anio);
                    lista.appendChild(item);
                });
            }
            msg.appendChild(lista);
            container.appendChild(msg);
        }

        document.getElementById('rejectBtn').addEventListener('click', () => decidirPelicula(false));
        document.getElementById('acceptBtn').addEventListener('click', () => decidirPelicula(true));
    </script>
</body>
</html>
