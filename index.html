<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cam match - Torneo</title>

    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Inter:wght@400;500;700&family=Oswald:wght@600&display=swap" rel="stylesheet">

    <!-- LIBRERÍAS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f7f2d4;
            color: #333333;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* Pantalla de Login */
        .login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f7f2d4; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .login-screen input {
            padding: 12px 20px; font-size: 1.1rem; border: 2px solid #6488b4;
            border-radius: 8px; margin-bottom: 15px; width: 260px; outline: none; text-align: center;
        }
        .login-screen button {
            padding: 12px 30px; font-size: 1.1rem; background-color: #6488b4; color: white;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }

        /* Título superior */
        .header-torneo {
            text-align: center;
            margin-top: 15px;
            margin-bottom: 15px;
            z-index: 10;
        }
        .header-torneo h1 {
            font-family: 'Fraunces', serif !important;
            font-weight: 900 !important;
            font-size: 2rem;
            color: #6488b4;
        }
        .header-torneo p {
            font-size: 1rem;
            font-weight: bold;
            color: rgba(120, 120, 120, 0.8);
        }

        /* Contenedor de los cruces (VS) */
        .match-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            padding: 10px;
            flex-grow: 1;
            position: relative;
            transition: all 0.5s ease;
        }

        .match-container.centrando {
            opacity: 0.5;
        }

        @media (min-width: 600px) and (orientation: landscape), (min-width: 768px) {
            .match-container { flex-direction: row; gap: 60px; }
        }

        /* Tarjeta de Película */
        .movie-card {
            display: flex;
            flex-direction: row;
            align-items: center;
            background: #ffffff;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(100, 136, 180, 0.15);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: 100%;
            max-width: 380px;
            position: relative;
        }

        .movie-card:hover {
            border-color: #6488b4;
            transform: scale(1.02);
        }

        /* Clases de animación */
        .movie-card.perdedora {
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }

        .movie-card.ganadora-centrada {
            transform: scale(1.1);
            box-shadow: 0 15px 35px rgba(100, 136, 180, 0.4);
            border-color: #6488b4;
            z-index: 100;
        }

        .movie-card.salida-derecha {
            transform: translateX(150%) rotate(10deg);
            opacity: 0;
        }
        .movie-card.salida-izquierda {
            transform: translateX(-150%) rotate(-10deg);
            opacity: 0;
        }

        /* Estilos de la foto */
        .movie-card .poster {
            width: 110px;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        /* Datos de la película */
        .movie-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 15px;
            flex-grow: 1;
        }

        /* Alineación según posición */
        @media (min-width: 600px) and (orientation: landscape), (min-width: 768px) {
            .movie-card:nth-child(1) .movie-info { text-align: left; }
            .movie-card:nth-child(2) { flex-direction: row-reverse; }
            .movie-card:nth-child(2) .movie-info { text-align: right; }
        }

        /* Tipografías internas */
        .movie-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 4px;
            order: 1; 
        }
        .movie-original-title {
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            color: #8c8c8c;
            text-transform: uppercase;
            margin-bottom: 4px;
            order: 2; 
        }
        .movie-year {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            color: #8c8c8c;
            margin-bottom: 6px;
            order: 3; 
        }
        .movie-details {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            color: #6488b4;
            text-transform: uppercase;
            font-weight: 600;
            line-height: 1.3;
            order: 4; 
        }

        /* El "VS" entre las películas */
        .vs-badge {
            font-family: 'Fraunces', serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: #6488b4;
            opacity: 0.3;
            background: white;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        /* --- ANIMACIÓN DE RONDA --- */
        .ronda-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f7f2d4;
            z-index: 5000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .ronda-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .ronda-texto {
            font-family: 'Fraunces', serif;
            font-weight: 900;
            font-size: 4rem;
            color: rgba(120, 120, 120, 0.8);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        /* Pantalla de Resultados */
        .resultados-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            width: 100%;
        }
        .resultados-screen h2 {
            font-family: 'Fraunces', serif;
            color: #6488b4;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .resultados-list {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            max-height: 60vh;
            overflow-y: auto;
            width: 100%;
            max-width: 400px;
            text-align: left;
        }
        .resultados-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div class="login-screen" id="loginScreen">
        <h1 style="font-family: 'Fraunces'; font-size: 2.5rem; color: #6488b4;">cam match</h1>
        <div style="margin-bottom: 20px; font-size: 1.1rem;">torneo de cine</div>
        <input type="text" id="usernameInput" placeholder="Tu nombre o alias" maxlength="15" autocomplete="off">
        <button id="loginBtn">Ingresar</button>
    </div>

    <!-- Overlay de Ronda -->
    <div class="ronda-overlay" id="rondaOverlay">
        <div class="ronda-texto" id="rondaTexto">RONDA 1</div>
    </div>

    <!-- Encabezado del torneo -->
    <div class="header-torneo" id="headerTorneo" style="display: none;">
        <h1>cam match</h1>
        <p id="textoRonda">Ronda 1</p>
    </div>

    <!-- Contenedor del Match (VS) -->
    <div class="match-container" id="matchContainer" style="display: none;">
        <div class="movie-card" id="cardA" onclick="seleccionarGanadora('A')">
            <img class="poster" id="posterA" src="" alt="">
            <div class="movie-info">
                <div class="movie-title" id="tituloA"></div>
                <div class="movie-original-title" id="originalA"></div> <!-- Ahora va 2do -->
                <div class="movie-year" id="anioA"></div> <!-- Ahora va 3ro -->
                <div class="movie-details" id="detallesA"></div>
            </div>
        </div>

        <div class="vs-badge" id="vsBadge">VS</div>

        <div class="movie-card" id="cardB" onclick="seleccionarGanadora('B')">
            <img class="poster" id="posterB" src="" alt="">
            <div class="movie-info">
                <div class="movie-title" id="tituloB"></div>
                <div class="movie-original-title" id="originalB"></div> <!-- Ahora va 2do -->
                <div class="movie-year" id="anioB"></div> <!-- Ahora va 3ro -->
                <div class="movie-details" id="detallesB"></div>
            </div>
        </div>
    </div>

    <!-- Pantalla de Resultados Finales -->
    <div class="resultados-screen" id="resultadosScreen">
        <h2>🏆 ¡Torneo Terminado!</h2>
        <p>Estas son las películas que elegiste:</p>
        <div class="resultados-list" id="resultadosList"></div>
    </div>

    <script>
        // CONEXIÓN A SUPABASE
        const SUPABASE_URL = 'https://sngdbenngxnbxhapkqkc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuZ2RiZW5uZ3huYnhoYXBrcWtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTA3MTYsImV4cCI6MjEwODI4NjcxNn0.2ypfGrSiDPeXoctRU5VCBGsZn3o6J62wwQ3ftMbUZ6w';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let usuarioActual = "";
        let peliculasTodas = [];
        
        // Variables de estado
        let rondaActual = 1;
        let crucesPendientes = [];
        let cruceActualIndex = 0;
        let ganadorasRonda = [];
        let historialGanadorasFinal = [];
        let turnoSalida = 1; // 1 para derecha, -1 para izquierda

        // Elementos del DOM
        const loginScreen = document.getElementById('loginScreen');
        const headerTorneo = document.getElementById('headerTorneo');
        const matchContainer = document.getElementById('matchContainer');
        const resultadosScreen = document.getElementById('resultadosScreen');
        const textoRonda = document.getElementById('textoRonda');
        const rondaOverlay = document.getElementById('rondaOverlay');
        const rondaTexto = document.getElementById('rondaTexto');
        const vsBadge = document.getElementById('vsBadge');

        // Login
        document.getElementById('loginBtn').addEventListener('click', iniciarTorneo);
        document.getElementById('usernameInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') iniciarTorneo();
        });

        async function iniciarTorneo() {
            const nombre = document.getElementById('usernameInput').value.trim();
            if (!nombre) return;
            usuarioActual = nombre;
            
            loginScreen.style.display = 'none';
            headerTorneo.style.display = 'block';
            matchContainer.style.display = 'flex';

            try {
                const respuesta = await fetch('./peliculas.json');
                const peliculasReales = await respuesta.json();
                
                peliculasTodas = peliculasReales.filter(p => p.activa === true);
                peliculasTodas.sort(() => Math.random() - 0.5);

                if (peliculasTodas.length % 2 !== 0) {
                    alert("El número de películas activas debe ser par. Hay " + peliculasTodas.length);
                    return;
                }

                mostrarAnimacionRonda(1, () => {
                    armarRonda(peliculasTodas);
                });
            } catch (error) {
                console.error("Error al cargar:", error);
                alert("Error al cargar las películas.");
            }
        }

        function mostrarAnimacionRonda(numeroRonda, callback) {
            matchContainer.style.opacity = 0;
            rondaTexto.innerText = `RONDA ${numeroRonda}`;
            rondaOverlay.classList.add('active');

            setTimeout(() => {
                rondaOverlay.classList.remove('active');
                setTimeout(() => {
                    matchContainer.style.opacity = 1;
                    if (callback) callback();
                }, 1000);
            }, 2000);
        }

        function abreviarNombre(nombreCompleto) {
            if (!nombreCompleto) return "";
            return nombreCompleto.split(' ').map((palabra, index, array) => {
                if (palabra[0] === palabra[0].toUpperCase() && index < array.length - 1) {
                    if (palabra.includes('-')) {
                        return palabra.split('-').map(p => p[0] + '.').join('-');
                    }
                    return palabra[0] + '.';
                }
                return palabra;
            }).join(' ');
        }

        function armarRonda(peliculas) {
            crucesPendientes = [];
            ganadorasRonda = [];
            cruceActualIndex = 0;

            for (let i = 0; i < peliculas.length; i += 2) {
                crucesPendientes.push({
                    peliculaA: peliculas[i],
                    peliculaB: peliculas[i + 1]
                });
            }

            mostrarCruce();
        }

        function mostrarCruce() {
            const cruce = crucesPendientes[cruceActualIndex];
            const A = cruce.peliculaA;
            const B = cruce.peliculaB;

            document.getElementById('cardA').className = 'movie-card';
            document.getElementById('cardB').className = 'movie-card';
            vsBadge.style.opacity = 0.3;
            vsBadge.style.transform = 'scale(1)';
            matchContainer.classList.remove('centrando');

            document.getElementById('posterA').src = A.poster || 'https://via.placeholder.com/110x160';
            document.getElementById('tituloA').textContent = A.titulo;
            document.getElementById('originalA').textContent = A.titulo_original || "";
            document.getElementById('anioA').textContent = A.anio;
            
            let detallesA = [];
            if (A.director) detallesA.push(abreviarNombre(A.director));
            if (A.pais) detallesA.push(A.pais);
            if (A.duracion) detallesA.push(`${A.duracion} min`);
            document.getElementById('detallesA').textContent = detallesA.join(' · ');

            document.getElementById('posterB').src = B.poster || 'https://via.placeholder.com/110x160';
            document.getElementById('tituloB').textContent = B.titulo;
            document.getElementById('originalB').textContent = B.titulo_original || "";
            document.getElementById('anioB').textContent = B.anio;
            
            let detallesB = [];
            if (B.director) detallesB.push(abreviarNombre(B.director));
            if (B.pais) detallesB.push(B.pais);
            if (B.duracion) detallesB.push(`${B.duracion} min`);
            document.getElementById('detallesB').textContent = detallesB.join(' · ');

            textoRonda.innerText = `Ronda ${rondaActual} - Cruce ${cruceActualIndex + 1} de ${crucesPendientes.length}`;
        }

        async function seleccionarGanadora(opcion) {
            if (matchContainer.classList.contains('centrando')) return;

            const cruce = crucesPendientes[cruceActualIndex];
            const ganadora = opcion === 'A' ? cruce.peliculaA : cruce.peliculaB;
            const perdedora = opcion === 'A' ? cruce.peliculaB : cruce.peliculaA;

            const cardGanadora = opcion === 'A' ? document.getElementById('cardA') : document.getElementById('cardB');
            const cardPerdedora = opcion === 'A' ? document.getElementById('cardB') : document.getElementById('cardA');

            cardPerdedora.classList.add('perdedora');
            vsBadge.style.opacity = 0;
            vsBadge.style.transform = 'scale(0)';
            
            matchContainer.classList.add('centrando');
            cardGanadora.classList.add('ganadora-centrada');
            
            cardPerdedora.style.display = 'none'; 

            _supabase.from('votos_torneo').insert({
                participante: usuarioActual,
                ronda: rondaActual,
                pelicula_a_id: cruce.peliculaA.id,
                pelicula_a_titulo: cruce.peliculaA.titulo,
                pelicula_b_id: cruce.peliculaB.id,
                pelicula_b_titulo: cruce.peliculaB.titulo,
                ganadora_id: ganadora.id,
                ganadora_titulo: ganadora.titulo
            }).then(({ error }) => {
                if (error) console.error("Error al guardar:", error);
            });

            ganadorasRonda.push(ganadora);
            if (rondaActual === 1 || ganadorasRonda.length === 1) {
                historialGanadorasFinal.push(ganadora);
            }

            setTimeout(() => {
                const claseSalida = turnoSalida === 1 ? 'salida-derecha' : 'salida-izquierda';
                cardGanadora.classList.add(claseSalida);
                turnoSalida *= -1;

                setTimeout(() => {
                    cardPerdedora.style.display = 'flex';
                    cruceActualIndex++;
                    
                    if (cruceActualIndex < crucesPendientes.length) {
                        mostrarCruce();
                    } else {
                        if (ganadorasRonda.length === 1) {
                            finalizarTorneo();
                        } else {
                            rondaActual++;
                            mostrarAnimacionRonda(rondaActual, () => {
                                armarRonda(ganadorasRonda);
                            });
                        }
                    }
                }, 600);

            }, 1000);
        }

        function finalizarTorneo() {
            matchContainer.style.display = 'none';
            headerTorneo.style.display = 'none';
            resultadosScreen.style.display = 'flex';

            const lista = document.getElementById('resultadosList');
            lista.innerHTML = '';
            
            historialGanadorasFinal.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = 'resultados-item';
                
                if (index === historialGanadorasFinal.length - 1) {
                    div.innerHTML = `<strong>🏆 ${p.titulo}</strong> <span>${p.anio}</span>`;
                    div.style.color = '#6488b4';
                } else {
                    div.innerHTML = `${p.titulo} <span>${p.anio}</span>`;
                }
                lista.appendChild(div);
            });
        }
    </script>
</body>
</html>
