<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cámara match - torneo de pelis</title>
    <link rel="manifest" href="/movie-match/manifest.json">
    
    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Inter:wght@400;500;700&family=Oswald:wght@600&display=swap" rel="stylesheet">

    <!-- LIBRERÍAS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f7f2d4;
            color: #333333;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* Pantalla de Login */
        .login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f7f2d4; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .login-screen input {
            padding: 12px 20px; font-size: 1.1rem; border: 2px solid #008080;
            border-radius: 8px; margin-bottom: 15px; width: 260px; outline: none; text-align: center;
        }
        .login-screen button {
            padding: 12px 30px; font-size: 1.1rem; background-color: #008080; color: white;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }

        /* Título superior */
        .header-torneo {
            text-align: center; margin-top: 15px; margin-bottom: 15px; z-index: 10;
        }
        .header-torneo h1 {
            font-family: 'Fraunces', serif !important; font-weight: 900 !important;
            font-size: 2rem; color: #008080;
        }
        .header-torneo p {
            font-size: 1rem; font-weight: bold; color: rgba(120, 120, 120, 0.8);
        }

        /* Contenedor de los cruces (VS) */
        .match-container {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 20px; width: 100%; max-width: 900px; padding: 10px; flex-grow: 1;
            position: relative;
        }

        @media (min-width: 600px) and (orientation: landscape), (min-width: 768px) {
            .match-container { flex-direction: row; gap: 60px; }
        }

        /* Tarjeta de Película */
        .movie-card {
            display: flex; flex-direction: row; align-items: center;
            background: #ffffff; border-radius: 16px; padding: 15px;
            box-shadow: 0 10px 25px rgba(0, 128, 128, 0.15);
            border: 2px solid transparent; cursor: pointer;
            opacity: 0; /* Arrancan invisibles */
            transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1), 
                        opacity 0.4s ease, 
                        box-shadow 0.4s ease,
                        border-color 0.3s ease;
            width: 100%; max-width: 380px; position: relative; z-index: 1;
        }

        /* Cuando están listas, se muestran */
        .movie-card.visible {
            opacity: 1;
        }

        .movie-card:hover {
            border-color: #008080;
        }

        /* Clases de animación */
        .movie-card.perdedora {
            transform: scale(0.8);
            opacity: 0;
            pointer-events: none;
        }

        .movie-card.ganadora-centrada {
            z-index: 100;
            box-shadow: 0 20px 40px rgba(0, 128, 128, 0.4);
            border-color: #008080;
            pointer-events: none;
        }

        /* Estilos de la foto */
        .movie-card .poster {
            width: 110px; height: 160px; object-fit: cover; border-radius: 8px; flex-shrink: 0;
            background-color: #f7f2d4; /* Fondo suave por si tarda en cargar */
        }

        /* Datos de la película */
        .movie-info {
            display: flex; flex-direction: column; justify-content: center;
            padding: 0 15px; flex-grow: 1;
        }

        @media (min-width: 600px) and (orientation: landscape), (min-width: 768px) {
            .movie-card:nth-child(1) .movie-info { text-align: left; }
            .movie-card:nth-child(2) { flex-direction: row-reverse; }
            .movie-card:nth-child(2) .movie-info { text-align: right; }
        }

        /* Orden de los datos */
        .movie-title { font-family: 'Oswald', sans-serif; font-size: 1.2rem; font-weight: 600; text-transform: uppercase; line-height: 1.1; margin-bottom: 4px; order: 1; }
        .movie-original-title { font-family: 'Oswald', sans-serif; font-size: 0.8rem; color: #8c8c8c; text-transform: uppercase; margin-bottom: 4px; order: 2; }
        .movie-year { font-family: 'Oswald', sans-serif; font-size: 1rem; color: #8c8c8c; margin-bottom: 6px; order: 3; }
        .movie-details { font-family: 'Inter', sans-serif; font-size: 0.75rem; color: #008080; text-transform: uppercase; font-weight: 600; line-height: 1.3; order: 4; }

        .vs-badge {
            font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.5rem; color: #008080;
            opacity: 0.3; background: white; width: 45px; height: 45px; display: flex;
            align-items: center; justify-content: center; border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: all 0.3s ease;
            flex-shrink: 0;
        }

        /* --- ANIMACIONES FULLSCREEN (RONDA Y GRILLA) --- */
        .ronda-overlay, .grilla-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: #f7f2d4; z-index: 5000; opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease;
        }
        .ronda-overlay.active, .grilla-overlay.active { opacity: 1; pointer-events: auto; }

        .ronda-texto {
            font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 3.5rem;
            color: rgba(150, 150, 150, 0.7); text-align: center; text-transform: uppercase; letter-spacing: -1px;
        }

        .grilla-container {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 15px; max-width: 600px; width: 90%;
        }
        .grilla-item { width: 70px; flex-shrink: 0; }
        @media (min-width: 600px) { .grilla-item { width: 100px; } }
        .grilla-item img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        /* --- PANTALLA FINAL --- */
        .resultados-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; width: 100%; max-width: 500px;
        }
        .trofeo { font-size: 3.5rem; margin-bottom: 5px; }
        .ganadora-texto { font-family: 'Fraunces', serif; color: #008080; font-size: 2.2rem; font-weight: 900; margin-bottom: 20px; line-height: 1.1; }

        .ficha-ganadora {
            background: white; border-radius: 16px; padding: 15px;
            box-shadow: 0 10px 25px rgba(0, 128, 128, 0.15); width: 240px;
            display: flex; flex-direction: column; align-items: center;
        }
        .ficha-ganadora img { width: 100%; height: auto; border-radius: 10px; margin-bottom: 12px; }
        .ficha-ganadora .movie-info { text-align: center; padding: 0; width: 100%; }
        .ficha-ganadora .movie-title { font-size: 1.3rem; margin-bottom: 2px; }
        .ficha-ganadora .movie-original-title { font-size: 0.85rem; margin-bottom: 4px; }
        .ficha-ganadora .movie-year { font-size: 1.1rem; margin-bottom: 6px; }
        .ficha-ganadora .movie-details { font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreen">
        <h1 style="font-family: 'Fraunces'; font-size: 2.5rem; color: #008080;">cámara match</h1>
        <div style="margin-bottom: 20px; font-size: 1.1rem;">torneo de pelis</div>
        <input type="text" id="usernameInput" placeholder="Tu nombre o alias" maxlength="15" autocomplete="off">
        <button id="loginBtn">Ingresar</button>
    </div>

    <div class="ronda-overlay" id="rondaOverlay">
        <div class="ronda-texto" id="rondaTexto">RONDA 1</div>
    </div>

    <div class="grilla-overlay" id="grillaOverlay">
        <div class="grilla-container" id="grillaContainer"></div>
    </div>

    <div class="header-torneo" id="headerTorneo" style="display: none;">
        <h1>cámara match</h1>
        <p id="textoRonda">Ronda 1</p>
    </div>

    <div class="match-container" id="matchContainer" style="display: none;">
        <div class="movie-card" id="cardA" onclick="seleccionarGanadora('A')">
            <img class="poster" id="posterA" src="" alt="">
            <div class="movie-info">
                <div class="movie-title" id="tituloA"></div>
                <div class="movie-original-title" id="originalA"></div>
                <div class="movie-year" id="anioA"></div>
                <div class="movie-details" id="detallesA"></div>
            </div>
        </div>

        <div class="vs-badge" id="vsBadge">VS</div>

        <div class="movie-card" id="cardB" onclick="seleccionarGanadora('B')">
            <img class="poster" id="posterB" src="" alt="">
            <div class="movie-info">
                <div class="movie-title" id="tituloB"></div>
                <div class="movie-original-title" id="originalB"></div>
                <div class="movie-year" id="anioB"></div>
                <div class="movie-details" id="detallesB"></div>
            </div>
        </div>
    </div>

    <div class="resultados-screen" id="resultadosScreen">
        <div class="trofeo">🏆</div>
        <div class="ganadora-texto">¡Tenemos tu ganadora!</div>
        
        <div class="ficha-ganadora" id="fichaGanadora">
            <img id="posterGanadora" src="" alt="">
            <div class="movie-info">
                <div class="movie-title" id="tituloGanadora"></div>
                <div class="movie-original-title" id="originalGanadora"></div>
                <div class="movie-year" id="anioGanadora"></div>
                <div class="movie-details" id="detallesGanadora"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sngdbenngxnbxhapkqkc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuZ2RiZW5uZ3huYnhoYXBrcWtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTA3MTYsImV4cCI6MjEwODI4NjcxNn0.2ypfGrSiDPeXoctRU5VCBGsZn3o6J62wwQ3ftMbUZ6w';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let usuarioActual = "";
        let peliculasTodas = [];
        let rondaActual = 1;
        let crucesPendientes = [];
        let cruceActualIndex = 0;
        let ganadorasRonda = [];
        let turnoSalida = 1;

        const loginScreen = document.getElementById('loginScreen');
        const headerTorneo = document.getElementById('headerTorneo');
        const matchContainer = document.getElementById('matchContainer');
        const resultadosScreen = document.getElementById('resultadosScreen');
        const textoRonda = document.getElementById('textoRonda');
        const rondaOverlay = document.getElementById('rondaOverlay');
        const rondaTexto = document.getElementById('rondaTexto');
        const vsBadge = document.getElementById('vsBadge');
        const grillaOverlay = document.getElementById('grillaOverlay');
        const grillaContainer = document.getElementById('grillaContainer');

        document.getElementById('loginBtn').addEventListener('click', iniciarTorneo);
        document.getElementById('usernameInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') iniciarTorneo();
        });

        async function iniciarTorneo() {
            const nombre = document.getElementById('usernameInput').value.trim();
            if (!nombre) return;
            usuarioActual = nombre;
            loginScreen.style.display = 'none';
            headerTorneo.style.display = 'block';
            matchContainer.style.display = 'flex';

            try {
                const respuesta = await fetch('./peliculas.json');
                const peliculasReales = await respuesta.json();
                peliculasTodas = peliculasReales.filter(p => p.activa === true);
                peliculasTodas.sort(() => Math.random() - 0.5);

                if (peliculasTodas.length % 2 !== 0) {
                    alert("El número de películas activas debe ser par. Hay " + peliculasTodas.length);
                    return;
                }
                iniciarRonda(peliculasTodas);
            } catch (error) {
                console.error("Error al cargar:", error);
                alert("Error al cargar las películas.");
            }
        }

        function iniciarRonda(peliculas) {
            matchContainer.style.opacity = 0;
            grillaOverlay.classList.remove('active');
            rondaOverlay.classList.remove('active');
            
            // NUEVO: Verificamos si es la final (cuando solo quedan 2 películas)
            const esFinal = (peliculas.length === 2);
            
            if (esFinal) {
                rondaTexto.innerText = `RONDA FINAL`;
                textoRonda.innerText = `Ronda Final`;
            } else {
                rondaTexto.innerText = `RONDA ${rondaActual}`;
                textoRonda.innerText = `Ronda ${rondaActual}`;
            }

            setTimeout(() => {
                // 1. Mostramos el cartel de RONDA X (o FINAL)
                rondaOverlay.classList.add('active');

                // 2. Esperamos 2 segundos a que se lea la ronda
                setTimeout(() => {
                    rondaOverlay.classList.remove('active');

                    // 3. Esperamos 1 segundo a que termine el fade out y mostramos la grilla
                    setTimeout(() => {
                        armarGrilla(peliculas);
                        grillaOverlay.classList.add('active');

                        // 4. Esperamos 2 segundos a que se vea la grilla
                        setTimeout(() => {
                            grillaOverlay.classList.remove('active');

                            // 5. Esperamos 1 segundo y arrancamos con los cruces
                            setTimeout(() => {
                                matchContainer.style.opacity = 1;
                                armarRonda(peliculas);
                            }, 1000);
                        }, 2000);
                    }, 1000);
                }, 2000);
            }, 500); 
        }

        function armarGrilla(peliculas) {
            grillaContainer.innerHTML = '';
            peliculas.forEach(p => {
                const div = document.createElement('div');
                div.className = 'grilla-item';
                div.innerHTML = `<img src="${p.poster || 'https://via.placeholder.com/110x160'}" alt="">`;
                grillaContainer.appendChild(div);
            });
        }

        function abreviarNombre(nombreCompleto) {
            if (!nombreCompleto) return "";
            return nombreCompleto.split(' ').map((palabra, index, array) => {
                if (palabra[0] === palabra[0].toUpperCase() && index < array.length - 1) {
                    if (palabra.includes('-')) return palabra.split('-').map(p => p[0] + '.').join('-');
                    return palabra[0] + '.';
                }
                return palabra;
            }).join(' ');
        }

        function armarRonda(peliculas) {
            crucesPendientes = [];
            ganadorasRonda = [];
            cruceActualIndex = 0;

            for (let i = 0; i < peliculas.length; i += 2) {
                crucesPendientes.push({ peliculaA: peliculas[i], peliculaB: peliculas[i + 1] });
            }
            mostrarCruce();
        }

        function mostrarCruce() {
            const cruce = crucesPendientes[cruceActualIndex];
            const A = cruce.peliculaA;
            const B = cruce.peliculaB;

            const cardA = document.getElementById('cardA');
            const cardB = document.getElementById('cardB');

            // 1. Ocultamos las tarjetas antes de cambiar el contenido
            cardA.classList.remove('visible');
            cardB.classList.remove('visible');

            // 2. Forzamos el re-renderizado moviendo las tarjetas (evita el borde fantasma)
            const parent = cardA.parentNode;
            parent.appendChild(cardA);
            parent.insertBefore(vsBadge, cardA.nextSibling);
            parent.appendChild(cardB);

            // 3. Limpiamos estilos en línea
            cardA.style.transform = '';
            cardB.style.transform = '';
            cardA.style.opacity = '';
            cardB.style.opacity = '';
            cardA.className = 'movie-card';
            cardB.className = 'movie-card';
            
            vsBadge.style.opacity = 0.3;
            vsBadge.style.transform = 'scale(1)';
            vsBadge.style.display = 'flex';

            // 4. Cargamos los datos
            document.getElementById('posterA').src = A.poster || 'https://via.placeholder.com/110x160';
            document.getElementById('tituloA').textContent = A.titulo;
            document.getElementById('originalA').textContent = A.titulo_original || "";
            document.getElementById('anioA').textContent = A.anio;
            let detallesA = [];
            if (A.director) detallesA.push(abreviarNombre(A.director));
            if (A.pais) detallesA.push(A.pais);
            if (A.duracion) detallesA.push(`${A.duracion} min`);
            document.getElementById('detallesA').textContent = detallesA.join(' · ');

            document.getElementById('posterB').src = B.poster || 'https://via.placeholder.com/110x160';
            document.getElementById('tituloB').textContent = B.titulo;
            document.getElementById('originalB').textContent = B.titulo_original || "";
            document.getElementById('anioB').textContent = B.anio;
            let detallesB = [];
            if (B.director) detallesB.push(abreviarNombre(B.director));
            if (B.pais) detallesB.push(B.pais);
            if (B.duracion) detallesB.push(`${B.duracion} min`);
            document.getElementById('detallesB').textContent = detallesB.join(' · ');

            // NUEVO: Si es la final, el subtítulo dice "Ronda Final"
            const esFinalCruce = (crucesPendientes.length === 1);
            if (esFinalCruce) {
                textoRonda.innerText = `Ronda Final - Cruce 1 de 1`;
            } else {
                textoRonda.innerText = `Ronda ${rondaActual} - Cruce ${cruceActualIndex + 1} de ${crucesPendientes.length}`;
            }

            // 5. Hacemos visibles las tarjetas una vez que todo está listo
            setTimeout(() => {
                cardA.classList.add('visible');
                cardB.classList.add('visible');
            }, 50);
        }

        async function seleccionarGanadora(opcion) {
            if (document.querySelector('.ganadora-centrada')) return; 

            const cruce = crucesPendientes[cruceActualIndex];
            const ganadora = opcion === 'A' ? cruce.peliculaA : cruce.peliculaB;
            
            const cardGanadora = opcion === 'A' ? document.getElementById('cardA') : document.getElementById('cardB');
            const cardPerdedora = opcion === 'A' ? document.getElementById('cardB') : document.getElementById('cardA');

            // 1. Perdedora desaparece
            cardPerdedora.classList.add('perdedora');
            vsBadge.style.opacity = 0;
            vsBadge.style.transform = 'scale(0)';
            
            // 2. Calculamos la distancia hacia el centro
            const rect = cardGanadora.getBoundingClientRect();
            const windowCenterX = window.innerWidth / 2;
            const windowCenterY = window.innerHeight / 2;
            const cardCenterX = rect.left + (rect.width / 2);
            const cardCenterY = rect.top + (rect.height / 2);

            const deltaX = windowCenterX - cardCenterX;
            const deltaY = windowCenterY - cardCenterY;

            // 3. Movemos la tarjeta al centro con transform (se desplaza suavemente)
            cardGanadora.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(1.05)`;
            cardGanadora.classList.add('ganadora-centrada');

            _supabase.from('votos_torneo').insert({
                participante: usuarioActual,
                ronda: rondaActual,
                pelicula_a_id: cruce.peliculaA.id,
                pelicula_a_titulo: cruce.peliculaA.titulo,
                pelicula_b_id: cruce.peliculaB.id,
                pelicula_b_titulo: cruce.peliculaB.titulo,
                ganadora_id: ganadora.id,
                ganadora_titulo: ganadora.titulo
            }).then(({ error }) => {
                if (error) console.error("Error al guardar:", error);
            });

            ganadorasRonda.push(ganadora);

            setTimeout(() => {
                // 4. Vuela hacia la izquierda o derecha
                const salidaX = turnoSalida === 1 ? window.innerWidth : -window.innerWidth;
                cardGanadora.style.transform = `translate(${salidaX}px, ${deltaY}px) rotate(${turnoSalida * 15}deg) scale(1.05)`;
                cardGanadora.style.opacity = '0';
                turnoSalida *= -1;

                setTimeout(() => {
                    // Restauramos todo para el próximo cruce
                    cardGanadora.classList.remove('ganadora-centrada');
                    cardPerdedora.classList.remove('perdedora');
                    
                    // Ocultamos las tarjetas para que no se vea el cambio brusco
                    cardGanadora.classList.remove('visible');
                    cardPerdedora.classList.remove('visible');

                    cardGanadora.style.transform = '';
                    cardGanadora.style.opacity = '';
                    
                    cruceActualIndex++;
                    if (cruceActualIndex < crucesPendientes.length) {
                        mostrarCruce();
                    } else {
                        if (ganadorasRonda.length === 1) {
                            finalizarTorneo(ganadora);
                        } else {
                            rondaActual++;
                            iniciarRonda(ganadorasRonda);
                        }
                    }
                }, 800); 
            }, 1500); 
        }

        function finalizarTorneo(ganadoraFinal) {
            matchContainer.style.display = 'none';
            headerTorneo.style.display = 'none';
            resultadosScreen.style.display = 'flex';

            document.getElementById('posterGanadora').src = ganadoraFinal.poster || 'https://via.placeholder.com/240x360';
            document.getElementById('tituloGanadora').textContent = ganadoraFinal.titulo;
            document.getElementById('originalGanadora').textContent = ganadoraFinal.titulo_original || "";
            document.getElementById('anioGanadora').textContent = ganadoraFinal.anio;
            
            let detalles = [];
            if (ganadoraFinal.director) detalles.push(abreviarNombre(ganadoraFinal.director));
            if (ganadoraFinal.pais) detalles.push(ganadoraFinal.pais);
            if (ganadoraFinal.duracion) detalles.push(`${ganadoraFinal.duracion} min`);
            document.getElementById('detallesGanadora').textContent = detalles.join(' · ');
        }
    </script>
    <script>
            if ('serviceWorker' in navigator) {navigator.serviceWorker.register('/movie-match/sw.js');
        }
    </script>
</body>
</html>
