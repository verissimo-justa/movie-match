<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cam match</title>
    
    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Inter:wght@400;500;700&family=Oswald:wght@600&display=swap" rel="stylesheet">

    <!-- LIBRERÍAS -->
    <script src="https://unpkg.com/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #f7f2d4; 
            color: #333333;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            /* Evita que el usuario haga zoom sin querer en el celular */
            touch-action: pan-y; 
        }

        h1 {
            font-family: 'Fraunces', serif !important;
            font-weight: 900 !important;
            font-size: 2.2rem; 
            margin-top: 0px;
            margin-bottom: 0px;
            color: #6488b4; 
            letter-spacing: -1px;
            text-align: center;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 1rem; 
            font-weight: 400;
            color: #222222;
            margin-bottom: 20px; 
            letter-spacing: 0.5px;
            text-align: center;
        }

        .login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f7f2d4;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-screen input {
            padding: 12px 20px;
            font-size: 1.1rem;
            border: 2px solid #6488b4;
            border-radius: 8px;
            margin-bottom: 15px;
            width: 260px;
            outline: none;
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #333333;
            text-align: center;
        }

        .login-screen button {
            padding: 12px 30px;
            font-size: 1.1rem;
            background-color: #6488b4;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: bold;
        }

        /* --- CONTENEDOR DE TARJETAS --- */
        .tinder-container {
            position: relative;
            width: 240px;  /* Ancho de la tarjeta */
            height: 390px; /* Altura exacta para que no se desborde ni pise los botones */
            perspective: 1000px;
            margin: 0 auto; 
        }

        .movie-card {
            position: absolute;
            width: 100%; 
            height: 100%; 
            /* EL CAMBIO ESTÁ AQUÍ: Fondo blanco sólido */
            background: #ffffff; 
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: grab;
            transform-origin: 50% 100%;
            transition: transform 0.2s ease, opacity 0.2s ease;
            border: 1px solid rgba(100, 136, 180, 0.15);
            padding: 10px; 
        }

        .movie-card img { 
            width: 100%; 
            height: 270px; 
            object-fit: contain; 
            /* EL CAMBIO ESTÁ AQUÍ: Fondo blanco para que se mezcle con la tarjeta */
            background-color: #ffffff; 
            pointer-events: none; 
            display: block; 
            border-radius: 12px; 
        }

        .movie-info { 
            /* Le damos un poco de espacio arriba para separar la foto del texto */
            padding: 10px 5px 0px 5px; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start; 
            /* CAMBIO: Transparente en lugar de blanco */
            background: transparent; 
            flex-grow: 1; 
        }

        .movie-title-row { 
            display: flex; 
            align-items: baseline; 
            justify-content: space-between; 
            gap: 6px; 
            width: 100%; 
            margin-bottom: 2px; 
        }

        .movie-title { 
            font-family: 'Oswald', sans-serif; 
            font-size: 1.05rem; 
            font-weight: 600; 
            color: #000000; 
            text-transform: uppercase; 
            letter-spacing: -0.3px; 
            line-height: 1.1; 
            /* EL TRUCO PARA TÍTULOS LARGOS: corta a las 2 líneas y pone "..." */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }
        
        .movie-year { 
            font-family: 'Oswald', sans-serif; 
            font-size: 0.95rem; 
            font-weight: 600; 
            color: #8c8c8c; 
        }
        
        .movie-original-title { 
            font-family: 'Oswald', sans-serif; 
            font-size: 0.75rem; 
            font-weight: 600; 
            color: #8c8c8c; 
            text-transform: uppercase; 
            letter-spacing: -0.3px; 
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* Corta el texto original si es muy largo */
        }

        /* --- BOTONES --- */
        .buttons { 
            margin-top: 25px; /* Separación de la tarjeta */
            display: flex; 
            gap: 25px; 
            justify-content: center; 
            position: relative; 
            z-index: 10; 
        }
        
        .btn { 
            border: none; 
            width: 55px; 
            height: 55px; 
            border-radius: 50%; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: none; 
            background-color: transparent; 
            border: 2px solid rgba(100, 136, 180, 0.6); 
            opacity: 0.6; 
            transition: transform 0.2s ease, opacity 0.2s ease, background-color 0.2s ease; 
        }
        
        .btn:hover, .btn:active { 
            transform: scale(1.2); 
            opacity: 1; 
            background-color: rgba(100, 136, 180, 0.1); 
        }

        /* --- RESULTADOS --- */
        .status-message { text-align: center; padding: 10px; color: #6488b4; font-weight: 700; font-size: 1.2rem; font-family: 'Inter', sans-serif; width: 100%; max-height: 100%; overflow-y: auto; }
        .likes-list { text-align: left; background: white; padding: 15px; border-radius: 12px; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 1rem; color: #333; max-height: 220px; overflow-y: auto; }
        .likes-item { padding: 6px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .likes-item span { color: #8c8c8c; }
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreen">
        <h1>cam match</h1>
        <div class="subtitle">pensamos el cine</div>
        <input type="text" id="usernameInput" placeholder="Tu nombre o alias" maxlength="15">
        <button id="loginBtn">Ingresar</button>
    </div>

    <h1>cam match</h1>
    <div class="subtitle">pensamos el cine</div>

    <div class="tinder-container" id="cardContainer"></div>

    <div class="buttons">
        <button class="btn btn-no" id="rejectBtn">
            <!-- Ícono X -->
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="#6488b4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <button class="btn btn-yes" id="acceptBtn">
            <!-- Ícono Corazón (un poco más grande para equiparar visualmente) -->
            <svg viewBox="0 0 24 24" width="28" height="28" fill="#6488b4" stroke="none">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
        </button>
    </div>
    
    <script>
        // CONEXIÓN A SUPABASE
        const SUPABASE_URL = 'https://sngdbenngxnbxhapkqkc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuZ2RiZW5uZ3huYnhoYXBrcWtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTA3MTYsImV4cCI6MjEwODI4NjcxNn0.2ypfGrSiDPeXoctRU5VCBGsZn3o6J62wwQ3ftMbUZ6w';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const container = document.getElementById('cardContainer');
        let usuarioActual = "";
        let peliculasElegidas = [];

        document.getElementById('loginBtn').addEventListener('click', () => {
            const nombre = document.getElementById('usernameInput').value.trim();
            if (nombre) {
                usuarioActual = nombre;
                document.getElementById('loginScreen').style.display = 'none';
                inicializarApp();
            }
        });

        async function inicializarApp() {
            try {
                const respuesta = await fetch('./peliculas.json');
                if (!respuesta.ok) throw new Error("No se encontró el archivo JSON");
                
                const peliculasReales = await respuesta.json();
                
                // Filtramos solo las activas
                const peliculasActivas = peliculasReales.filter(pelicula => pelicula.activa === true);
                
                // Mezclamos
                peliculasActivas.sort(() => Math.random() - 0.5);
                
                // Cargamos
                cargarTarjetas(peliculasActivas);
            } catch (error) {
                console.error("Error al cargar:", error);
                container.innerHTML = "<div class='status-message'>Error al cargar las películas.</div>";
            }
        }

        function cargarTarjetas(listaPeliculas) {
            container.innerHTML = ""; 
            listaPeliculas.forEach((movie, index) => {
                const card = document.createElement('div');
                card.classList.add('movie-card');
                card.setAttribute('data-id', movie.id);
                card.setAttribute('data-titulo', movie.titulo);
                card.setAttribute('data-anio', movie.anio);
                card.style.zIndex = listaPeliculas.length - index; 
                
                const tituloOriginal = movie.titulo_original || movie.titulo;
                const urlPoster = movie.poster ? movie.poster : 'https://via.placeholder.com/600x900/cccccc/ffffff?text=Sin+Imagen';
                
                card.innerHTML = `
                    <img src="${urlPoster}" alt="${movie.titulo}">
                    <div class="movie-info">
                        <div class="movie-title-row">
                            <span class="movie-title">${movie.titulo}</span>
                            <span class="movie-year">${movie.anio}</span>
                        </div>
                        <div class="movie-original-title">${tituloOriginal}</div>
                    </div>
                `;
                container.appendChild(card);
                configurarGesto(card);
            });
        }

        function configurarGesto(card) {
            const hamertime = new Hammer(card);
            hamertime.on('pan', (event) => {
                card.style.transition = 'none';
                let rotation = event.deltaX / 15; // Un poco menos de rotación para que sea sutil
                card.style.transform = `translate(${event.deltaX}px, ${event.deltaY}px) rotate(${rotation}deg)`;
            });

            hamertime.on('panend', (event) => {
                card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                if (event.deltaX > 100) { // Reduje un poco la distancia para que sea más fácil deslizar
                    animarSalida(card, 1000, event.deltaY, true);
                } else if (event.deltaX < -100) {
                    animarSalida(card, -1000, event.deltaY, false);
                } else {
                    card.style.transform = 'translate(0px, 0px) rotate(0deg)';
                }
            });
        }

        function animarSalida(card, x, y, esLike) {
            card.style.transform = `translate(${x}px, ${y}px) rotate(${x/10}deg)`;
            card.style.opacity = '0';
            
            if (esLike) {
                peliculasElegidas.push({
                    id: card.getAttribute('data-id'),
                    titulo: card.getAttribute('data-titulo'),
                    anio: card.getAttribute('data-anio')
                });
            }
            
            setTimeout(() => {
                card.remove();
                if (container.children.length === 0) {
                    finalizarVotacion();
                }
            }, 300);
        }

        async function finalizarVotacion() {
            document.querySelector('.buttons').style.display = 'none';
            
            if (peliculasElegidas.length > 0) {
                try {
                    const votosAEnviar = peliculasElegidas.map(p => ({
                        participante: usuarioActual,
                        pelicula_id: p.id,
                        pelicula_titulo: p.titulo
                    }));
        
                    const { error } = await _supabase
                        .from('votos_taller')
                        .insert(votosAEnviar);
        
                    if (error) console.error("Error al guardar votos:", error);
                    else console.log("Votos guardados exitosamente");
                    
                } catch (err) {
                    console.error("Error de conexión:", err);
                }
            }
        
            let HTMLResultados = `
                <div class='status-message'>
                    🍿 ¡Elegiste ${peliculasElegidas.length} películas!<br>
                    <div class='likes-list'>
            `;
            
            if(peliculasElegidas.length === 0) {
                HTMLResultados += "<div style='text-align:center;color:#8c8c8c;padding:20px;'>No seleccionaste ninguna película.</div>";
            } else {
                peliculasElegidas.forEach(p => {
                    HTMLResultados += `<div class='likes-item'>${p.titulo} <span>${p.anio}</span></div>`;
                });
            }
            
            HTMLResultados += `</div></div>`;
            container.innerHTML = HTMLResultados;
        }

        document.getElementById('rejectBtn').addEventListener('click', () => {
            const tarjetaActual = container.querySelector('.movie-card');
            if (tarjetaActual) animarSalida(tarjetaActual, -1000, 0, false);
        });

        document.getElementById('acceptBtn').addEventListener('click', () => {
            const tarjetaActual = container.querySelector('.movie-card');
            if (tarjetaActual) animarSalida(tarjetaActual, 1000, 0, true);
        });
    </script>
</body>
</html>
