<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados Finales - Cámara Match</title>

    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Inter:wght@400;500;700&family=Oswald:wght@600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f7f2d4;
            color: #333333;
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 900;
            font-size: 2.2rem;
            color: #6488b4;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 30px;
            text-align: center;
        }

        .loading {
            font-size: 1.2rem;
            color: #6488b4;
            font-weight: bold;
            margin-top: 50px;
        }

        .ranking {
            background: white;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(100, 136, 180, 0.15);
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .ranking-item:last-child {
            border-bottom: none;
        }

        .posicion {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #8c8c8c;
            width: 40px;
            flex-shrink: 0;
        }

        .info {
            flex-grow: 1;
            padding-right: 15px;
        }

        .titulo {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            line-height: 1.1;
            color: #333;
        }

        .desglose {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            color: #999;
            margin-top: 3px;
            text-transform: uppercase;
        }

        .puntos {
            font-family: 'Oswald', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: #6488b4;
            text-align: right;
            flex-shrink: 0;
            min-width: 60px;
        }

        /* Efecto para el Top 3 */
        .top-1 .posicion { color: #d4af37; font-size: 2rem; }
        .top-1 .titulo { color: #6488b4; }
        .top-2 .posicion { color: #a8a8a8; }
        .top-3 .posicion { color: #cd7f32; }
    </style>
</head>
<body>

    <h1>Resultados del Torneo</h1>
    <div class="subtitle" id="subtitulo">Calculando puntos...</div>

    <div class="loading" id="loading">Cargando datos ⏳</div>
    
    <div class="ranking" id="rankingContainer" style="display: none;"></div>

    <script>
        const SUPABASE_URL = 'https://sngdbenngxnbxhapkqkc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuZ2RiZW5uZ3huYnhoYXBrcWtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTA3MTYsImV4cCI6MjEwODI4NjcxNn0.2ypfGrSiDPeXoctRU5VCBGsZn3o6J62wwQ3ftMbUZ6w';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // LÓGICA DE PUNTOS: Por Ronda Alcanzada
        const PUNTOS_RONDA = { 1: 0, 2: 1, 3: 2, 4: 3 };
        const BONO_GANADORA = 5; 

        async function calcularResultados() {
            try {
                const { data: votos, error } = await _supabase
                    .from('votos_torneo')
                    .select('*');

                if (error) throw error;
                if (!votos || votos.length === 0) {
                    document.getElementById('loading').innerText = "Aún no hay votos registrados.";
                    return;
                }

                // Agrupamos los votos por participante
                const participantes = {};
                votos.forEach(v => {
                    if (!participantes[v.participante]) participantes[v.participante] = [];
                    participantes[v.participante].push(v);
                });

                const puntajes = {};
                const desgloses = {};
                const infoPeliculas = {};

                // Calculamos los puntos para cada participante
                for (const [nombre, votosDelParticipante] of Object.entries(participantes)) {
                    
                    // Ronda máxima a la que llegó este participante
                    const rondaMaxima = Math.max(...votosDelParticipante.map(v => v.ronda));

                    votosDelParticipante.forEach(voto => {
                        const idGanadora = voto.ganadora_id;
                        const tituloGanadora = voto.ganadora_titulo;

                        if (!infoPeliculas[idGanadora]) infoPeliculas[idGanadora] = { titulo: tituloGanadora };
                        if (!puntajes[idGanadora]) {
                            puntajes[idGanadora] = 0;
                            desgloses[idGanadora] = { 2: 0, 3: 0, 4: 0, bono: 0 }; // Solo contamos de R2 en adelante
                        }

                        // Sumamos puntos por la ronda alcanzada
                        let puntos = PUNTOS_RONDA[voto.ronda] || 0;
                        puntajes[idGanadora] += puntos;
                        
                        // Si la ronda fue 2, 3 o 4, lo anotamos en el desglose
                        if (voto.ronda >= 2) {
                            desgloses[idGanadora][voto.ronda]++;
                        }

                        // Si esta victoria fue en la ronda máxima (la final), sumamos el bono
                        if (voto.ronda === rondaMaxima) {
                            puntajes[idGanadora] += BONO_GANADORA;
                            desgloses[idGanadora].bono++;
                        }
                    });
                }

                // Ordenamos el ranking
                const rankingArray = Object.keys(puntajes).map(id => ({
                    id: id,
                    titulo: infoPeliculas[id].titulo,
                    puntos: puntajes[id],
                    desglose: desgloses[id]
                })).sort((a, b) => b.puntos - a.puntos);

                // Mostramos en pantalla
                document.getElementById('loading').style.display = 'none';
                
                const participantesUnicos = Object.keys(participantes).length;
                document.getElementById('subtitulo').innerText = `Total de participantes: ${participantesUnicos}`;
                
                const contenedor = document.getElementById('rankingContainer');
                contenedor.style.display = 'block';
                contenedor.innerHTML = '';

                rankingArray.forEach((peli, index) => {
                    const div = document.createElement('div');
                    div.className = 'ranking-item';
                    if (index === 0) div.classList.add('top-1');
                    else if (index === 1) div.classList.add('top-2');
                    else if (index === 2) div.classList.add('top-3');

                    // Armamos el desglose
                    let desgloseTexto = [];
                    if (peli.desglose[2] > 0) desgloseTexto.push(`${peli.desglose[2]}xLlegó R2`);
                    if (peli.desglose[3] > 0) desgloseTexto.push(`${peli.desglose[3]}xLlegó R3`);
                    if (peli.desglose[4] > 0) desgloseTexto.push(`${peli.desglose[4]}xLlegó Final`);
                    if (peli.desglose.bono > 0) desgloseTexto.push(`+${peli.desglose.bono * BONO_GANADORA}pt Bono`);

                    div.innerHTML = `
                        <div class="posicion">#${index + 1}</div>
                        <div class="info">
                            <div class="titulo">${peli.titulo}</div>
                            <div class="desglose">${desgloseTexto.join(' · ')}</div>
                        </div>
                        <div class="puntos">
                            ${peli.puntos} pts
                        </div>
                    `;
                    contenedor.appendChild(div);
                });

            } catch (error) {
                console.error("Error al calcular:", error);
                document.getElementById('loading').innerText = "Error al cargar los datos.";
            }
        }

        calcularResultados();
    </script>
</body>
</html>
