<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados finales - cámara match</title>

    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Inter:wght@400;500;700&family=Oswald:wght@600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        @font-face {
            font-family: 'CooperLtBT';
            src: url('/movie-match/CooperLtBT.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        body {
            background-color: #f7f2d4;
            color: #333333;
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-family: 'CooperLtBT', 'Fraunces', serif;
            font-weight: bold;
            font-size: 2.2rem;
            color: #008080;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 30px;
            text-align: center;
        }

        .loading {
            font-size: 1.2rem;
            color: #008080;
            font-weight: bold;
            margin-top: 50px;
        }

        .ranking {
            background: white;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0, 128, 128, 0.15);
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .ranking-item:last-child {
            border-bottom: none;
        }

        .posicion {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #8c8c8c;
            width: 40px;
            flex-shrink: 0;
        }

        .info {
            flex-grow: 1;
            padding-right: 15px;
        }

        .titulo {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            line-height: 1.1;
            color: #333;
        }

        .desglose {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            color: #999;
            margin-top: 3px;
            text-transform: uppercase;
        }

        .puntos {
            font-family: 'Oswald', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: #008080;
            text-align: right;
            flex-shrink: 0;
            min-width: 60px;
        }

        /* Efecto para el Top 3 */
        .top-1 .posicion { color: #d4af37; font-size: 2rem; }
        .top-1 .titulo { color: #008080; }
        .top-2 .posicion { color: #a8a8a8; }
        .top-3 .posicion { color: #cd7f32; }
    </style>
</head>
<body>

    <h1>Resultados del torneo</h1>
    <div class="subtitle" id="subtitulo">Calculando puntos...</div>

    <div class="loading" id="loading">Cargando datos ⏳</div>
    
    <div class="ranking" id="rankingContainer" style="display: none;"></div>

    <script>
        const SUPABASE_URL = 'https://sngdbenngxnbxhapkqkc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuZ2RiZW5uZ3huYnhoYXBrcWtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTA3MTYsImV4cCI6MjEwODI4NjcxNn0.2ypfGrSiDPeXoctRU5VCBGsZn3o6J62wwQ3ftMbUZ6w';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Puntos por ronda
        const PUNTOS_RONDA = { 1: 1, 2: 2, 3: 3, 4: 4 };
        const BONO_GANADORA = 5; 

        async function calcularResultados() {
            try {
                const { data: votos, error } = await _supabase
                    .from('votos_torneo')
                    .select('*');

                if (error) throw error;
                if (!votos || votos.length === 0) {
                    document.getElementById('loading').innerText = "Aún no hay votos registrados.";
                    return;
                }

                const puntajes = {};
                const desgloses = {};
                const infoPeliculas = {};

                votos.forEach(voto => {
                    const idGanadora = voto.ganadora_id;
                    const tituloGanadora = voto.ganadora_titulo;
                    const ronda = voto.ronda;

                    // Detectamos si es un voto de la Terna Final (A y B son iguales)
                    const esTernaFinal = (voto.pelicula_a_id === voto.pelicula_b_id);

                    if (!infoPeliculas[idGanadora]) infoPeliculas[idGanadora] = { titulo: tituloGanadora };
                    if (!puntajes[idGanadora]) {
                        puntajes[idGanadora] = 0;
                        desgloses[idGanadora] = { 1: 0, 2: 0, 3: 0, 4: 0, bono: 0, salvadas: 0 };
                    }

                    // Si es la Terna Final, el voto vale 4 puntos (ronda) + 5 (bono)
                    if (esTernaFinal) {
                        puntajes[idGanadora] += PUNTOS_RONDA[4] + BONO_GANADORA;
                        desgloses[idGanadora][4]++; // Contamos la victoria en la final
                        desgloses[idGanadora].bono++;
                        
                        // Si la ronda original no era 4 (fue salvada), anotamos eso
                        if (ronda !== 4) {
                            desgloses[idGanadora].salvadas++;
                        }
                    } else {
                        // Es un cruce normal
                        let puntosRonda = PUNTOS_RONDA[ronda] || 0;
                        puntajes[idGanadora] += puntosRonda;
                        desgloses[idGanadora][ronda]++;
                    }
                });

                // Ordenamos el ranking
                const rankingArray = Object.keys(puntajes).map(id => ({
                    id: id,
                    titulo: infoPeliculas[id].titulo,
                    puntos: puntajes[id],
                    desglose: desgloses[id]
                })).sort((a, b) => b.puntos - a.puntos);

                // Mostramos en pantalla
                document.getElementById('loading').style.display = 'none';
                
                const participantesUnicos = new Set(votos.map(v => v.participante)).size;
                document.getElementById('subtitulo').innerText = `Total de participantes: ${participantesUnicos}`;
                
                const contenedor = document.getElementById('rankingContainer');
                contenedor.style.display = 'block';
                contenedor.innerHTML = '';

                rankingArray.forEach((peli, index) => {
                    const div = document.createElement('div');
                    div.className = 'ranking-item';
                    if (index === 0) div.classList.add('top-1');
                    else if (index === 1) div.classList.add('top-2');
                    else if (index === 2) div.classList.add('top-3');

                    // Armamos el desglose
                    let desgloseTexto = [];
                    
                    if (peli.desglose[1] > 0) desgloseTexto.push(`${peli.desglose[1]}xGanó R1`);
                    if (peli.desglose[2] > 0) desgloseTexto.push(`${peli.desglose[2]}xGanó R2`);
                    if (peli.desglose[3] > 0) desgloseTexto.push(`${peli.desglose[3]}xGanó R3`);
                    
                    if (peli.desglose[4] > 0) {
                        desgloseTexto.push(`${peli.desglose[4]}xGanó Final`);
                        desgloseTexto.push(`+${peli.desglose.bono * BONO_GANADORA}pt Bono`);
                    } else {
                        // Si no ganó la final, sus puntos son por salvación
                        if (peli.desglose.salvadas > 0) {
                            desgloseTexto.push(`${peli.desglose.salvadas}xSalvada`);
                        }
                    }

                    div.innerHTML = `
                        <div class="posicion">#${index + 1}</div>
                        <div class="info">
                            <div class="titulo">${peli.titulo}</div>
                            <div class="desglose">${desgloseTexto.join(' · ')}</div>
                        </div>
                        <div class="puntos">
                            ${peli.puntos} pts
                        </div>
                    `;
                    contenedor.appendChild(div);
                });

            } catch (error) {
                console.error("Error al calcular:", error);
                document.getElementById('loading').innerText = "Error al cargar los datos.";
            }
        }

        calcularResultados();
    </script>
</body>
</html>
