<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados Finales - Cam Match</title>

    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Inter:wght@400;500;700&family=Oswald:wght@600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f7f2d4;
            color: #333333;
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 900;
            font-size: 2.2rem;
            color: #6488b4;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 30px;
            text-align: center;
        }

        .loading {
            font-size: 1.2rem;
            color: #6488b4;
            font-weight: bold;
            margin-top: 50px;
        }

        .ranking {
            background: white;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(100, 136, 180, 0.15);
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .ranking-item:last-child {
            border-bottom: none;
        }

        .posicion {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #8c8c8c;
            width: 40px;
            flex-shrink: 0;
        }

        .poster-mini {
            width: 45px;
            height: 65px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .info {
            flex-grow: 1;
        }

        .titulo {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            line-height: 1.1;
            color: #333;
        }

        .anio {
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            color: #8c8c8c;
        }

        .puntos {
            font-family: 'Oswald', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: #6488b4;
            text-align: right;
            flex-shrink: 0;
        }
        .puntos small {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            color: #8c8c8c;
            font-weight: 400;
        }

        /* Efecto para el Top 3 */
        .top-1 .posicion { color: #d4af37; font-size: 2rem; } /* Oro */
        .top-1 .titulo { color: #6488b4; }
        .top-2 .posicion { color: #a8a8a8; } /* Plata */
        .top-3 .posicion { color: #cd7f32; } /* Bronce */
    </style>
</head>
<body>

    <h1>Resultados del Torneo</h1>
    <div class="subtitle" id="subtitulo">Calculando puntos de consenso...</div>

    <div class="loading" id="loading">Cargando datos de los participantes ⏳</div>
    
    <div class="ranking" id="rankingContainer" style="display: none;"></div>

    <script>
        const SUPABASE_URL = 'https://sngdbenngxnbxhapkqkc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuZ2RiZW5uZ3huYnhoYXBrcWtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTA3MTYsImV4cCI6MjEwODI4NjcxNn0.2ypfGrSiDPeXoctRU5VCBGsZn3o6J62wwQ3ftMbUZ6w';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Puntos por ronda según tu lógica
        const PUNTOS_RONDA = {
            1: 0,
            2: 1,
            3: 2,
            4: 3
        };
        const PUNTOS_GANADORA_EXTRA = 5;

        async function calcularResultados() {
            try {
                // 1. Traemos todos los votos de la tabla
                const { data: votos, error } = await _supabase
                    .from('votos_torneo')
                    .select('*');

                if (error) throw error;

                if (!votos || votos.length === 0) {
                    document.getElementById('loading').innerText = "Aún no hay votos registrados.";
                    return;
                }

                // 2. Agrupamos los votos por participante para saber dónde terminó el torneo de cada uno
                const participantes = {};
                votos.forEach(v => {
                    if (!participantes[v.participante]) {
                        participantes[v.participante] = [];
                    }
                    participantes[v.participante].push(v);
                });

                const puntajes = {};
                const infoPeliculas = {}; // Para guardar el póster y el año

                // 3. Calculamos los puntos
                for (const [nombre, votosDelParticipante] of Object.entries(participantes)) {
                    
                    // Encontramos cuál fue la ronda máxima de este participante (la final)
                    const rondaMaxima = Math.max(...votosDelParticipante.map(v => v.ronda));

                    votosDelParticipante.forEach(voto => {
                        const idGanadora = voto.ganadora_id;
                        const tituloGanadora = voto.ganadora_titulo;

                        // Guardamos la info de la película (la primera vez que la vemos)
                        if (!infoPeliculas[idGanadora]) {
                            infoPeliculas[idGanadora] = { titulo: tituloGanadora };
                        }

                        // Inicializamos el puntaje si no existe
                        if (!puntajes[idGanadora]) puntajes[idGanadora] = 0;

                        // Sumamos los puntos de la ronda en la que ganó este cruce
                        let puntosRonda = PUNTOS_RONDA[voto.ronda] || 0;
                        puntajes[idGanadora] += puntosRonda;

                        // Si este cruce era de la última ronda de este participante (la final), sumamos los 5 extra
                        if (voto.ronda === rondaMaxima) {
                            puntajes[idGanadora] += PUNTOS_GANADORA_EXTRA;
                        }
                    });
                }

                // 4. Ordenamos el ranking
                const rankingArray = Object.keys(puntajes).map(id => ({
                    id: id,
                    titulo: infoPeliculas[id].titulo,
                    puntos: puntajes[id]
                })).sort((a, b) => b.puntos - a.puntos);

                // 5. Mostramos en pantalla
                document.getElementById('loading').style.display = 'none';
                document.getElementById('subtitulo').innerText = `Torneo finalizado. Total de participantes: ${Object.keys(participantes).length}`;
                
                const contenedor = document.getElementById('rankingContainer');
                contenedor.style.display = 'block';
                contenedor.innerHTML = '';

                rankingArray.forEach((peli, index) => {
                    const div = document.createElement('div');
                    div.className = 'ranking-item';
                    if (index === 0) div.classList.add('top-1');
                    else if (index === 1) div.classList.add('top-2');
                    else if (index === 2) div.classList.add('top-3');

                    div.innerHTML = `
                        <div class="posicion">#${index + 1}</div>
                        <div class="info">
                            <div class="titulo">${peli.titulo}</div>
                        </div>
                        <div class="puntos">
                            ${peli.puntos} pts
                        </div>
                    `;
                    contenedor.appendChild(div);
                });

            } catch (error) {
                console.error("Error al calcular:", error);
                document.getElementById('loading').innerText = "Error al cargar los datos.";
            }
        }

        // Ejecutamos al cargar la página
        calcularResultados();
    </script>
</body>
</html>
